<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <meta name="description" content="A compact, local-first tracker for astrophysics goals and achievements.">
  <title>Astron Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tracker-shell">
    <header class="tracker-header">
      <div class="identity"><span class="scope">ASTRON / TRACKER</span><h1>Trajectory</h1></div>
      <div class="header-actions">
        <select id="year" aria-label="Academic year"></select>
        <button class="quiet-button" id="newYear">New year</button>
        <button class="primary-button" id="addItem">Add item</button>
        <details class="more-menu">
          <summary aria-label="More options">•••</summary>
          <div class="menu-panel">
            <button id="exportData">Export data</button>
            <button id="importData">Import data</button>
            <button class="danger" id="clearYear">Clear current year</button>
          </div>
        </details>
      </div>
    </header>

    <section class="summary" aria-label="Year summary">
      <div class="progress-cell">
        <div class="progress-ring" id="progressRing"><span id="progress">0%</span></div>
        <div><span class="label">Year progress</span><strong id="progressNote">0 / 0 complete</strong></div>
      </div>
      <div class="metric"><span class="label">Next date</span><strong id="nextDate">None</strong><small id="nextTitle">No upcoming goals</small></div>
      <div class="metric"><span class="label">Achievements</span><strong id="achievements">0</strong><small>recorded this year</small></div>
    </section>

    <nav class="category-tabs" id="categoryTabs" aria-label="Tracker categories"></nav>

    <section class="list-panel">
      <div class="list-heading">
        <div><span class="label" id="categoryLabel">Academic</span><h2 id="categoryProgress">0 of 0 complete</h2></div>
        <label class="completed-toggle"><input type="checkbox" id="showDone">Show completed</label>
      </div>
      <div class="task-list" id="taskList"></div>
      <footer class="tracker-footer"><span>Saved in this browser</span><span id="visibleCount">0 visible</span></footer>
    </section>
  </main>

  <dialog id="itemDialog">
    <form id="itemForm">
      <div class="modal-title"><div><span class="label">New record</span><h2>Add an item</h2></div><button type="button" id="closeDialog" aria-label="Close">×</button></div>
      <label>Title<input name="title" required maxlength="160" autofocus></label>
      <div class="form-row">
        <label>Category<select name="category" id="itemCategory"></select></label>
        <label>Type<select name="type"><option value="goal">Goal</option><option value="achievement">Achievement</option></select></label>
      </div>
      <label>Date<input name="date" type="date"></label>
      <label>Notes<textarea name="notes" maxlength="400" rows="2"></textarea></label>
      <div class="modal-actions"><button type="button" class="quiet-button" id="cancelDialog">Cancel</button><button class="primary-button">Save</button></div>
    </form>
  </dialog>
  <dialog id="confirmDialog">
    <form id="confirmForm">
      <div class="modal-title">
        <div><span class="label">Confirm action</span><h2 id="confirmTitle">Are you sure?</h2></div>
        <button type="button" id="confirmClose" aria-label="Close">×</button>
      </div>
      <p id="confirmMessage" style="margin:0;color:var(--muted);font-size:12px;line-height:1.5;"></p>
      <div class="modal-actions">
        <button type="button" class="quiet-button" id="confirmCancel">Cancel</button>
        <button type="submit" class="primary-button" id="confirmAccept">Delete</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
